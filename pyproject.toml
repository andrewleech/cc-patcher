[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-patcher"
version = "0.1.0"
description = "Reusable ELF/Mach-O/Bun-aware patcher engine for the Claude Code binary, with a plugin entry-point contract for provider-supplied patches."
readme = "cc_patcher/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
cc-patcher = "cc_patcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cc_patcher"]
